<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portland Trip — Libby's Survey 🌊</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; padding: 2rem 1rem; padding-top: 4rem; }
    .container { max-width: 620px; margin: 0 auto; }
    h1 { font-size: 1.6rem; color: #2d5016; margin-bottom: 0.3rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .week-nav { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .week-pill { padding: 0.35rem 0.8rem; border-radius: 20px; font-size: 0.8rem; border: none; cursor: pointer; font-family: 'Georgia', serif; transition: all 0.2s; }
    .week-pill.locked { background: #e0dbd5; color: #aaa; cursor: not-allowed; }
    .week-pill.unlocked { background: #cde4f0; color: #1a5c7a; }
    .week-pill.done { background: #4a7fa5; color: white; }
    .week-pill.active { background: #1a4a6a; color: white; }
    .week-section { display: none; }
    .week-section.active { display: block; }
    .week-header { margin-bottom: 1.2rem; }
    .week-header h2 { font-size: 1.2rem; color: #1a4a6a; }
    .week-header .intro { font-size: 0.9rem; color: #777; margin-top: 0.3rem; line-height: 1.5; }
    .question-card { background: white; border-radius: 12px; padding: 1.4rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .question-text { font-size: 0.95rem; color: #333; line-height: 1.55; margin-bottom: 1rem; }
    .place-image-wrap { margin-bottom: 1rem; }
    .place-image-wrap a { display: inline-block; border-radius: 8px; overflow: hidden; border: 1px solid #e8e2db; }
    .place-image-wrap img { width: 200px; height: 140px; object-fit: cover; display: block; }
    .scale-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .scale-btn { width: 48px; height: 48px; border-radius: 8px; border: 2px solid #cde4f0; background: white; font-size: 1rem; font-family: 'Georgia', serif; cursor: pointer; transition: all 0.15s; }
    .scale-btn.selected { background: #4a7fa5; border-color: #4a7fa5; color: white; }
    .scale-labels { display: flex; justify-content: space-between; font-size: 0.72rem; color: #aaa; margin-top: 0.3rem; }
    .yesno-btns { display: flex; gap: 0.6rem; }
    .yn-btn { flex: 1; padding: 0.65rem; border-radius: 8px; border: 2px solid #e0dbd5; background: white; font-size: 0.95rem; font-family: 'Georgia', serif; cursor: pointer; transition: all 0.15s; }
    .yn-btn.yes.selected { background: #4a7fa5; border-color: #4a7fa5; color: white; }
    .yn-btn.no.selected { background: #c0392b; border-color: #c0392b; color: white; }
    .multi-options { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .multi-opt { padding: 0.45rem 0.9rem; border-radius: 20px; border: 2px solid #cde4f0; background: white; font-size: 0.85rem; font-family: 'Georgia', serif; cursor: pointer; transition: all 0.15s; }
    .multi-opt.selected { background: #4a7fa5; border-color: #4a7fa5; color: white; }
    .text-input { width: 100%; padding: 0.6rem 0.8rem; border: 2px solid #e0dbd5; border-radius: 8px; font-size: 0.9rem; font-family: 'Georgia', serif; resize: vertical; min-height: 72px; }
    .text-input:focus { outline: none; border-color: #4a7fa5; }
    .no-pref-wrap { margin-top: 0.8rem; }
    .no-pref-btn { background: none; border: 1px dashed #c0b8b0; border-radius: 6px; color: #999; font-size: 0.8rem; font-family: 'Georgia', serif; padding: 0.3rem 0.75rem; cursor: pointer; transition: all 0.15s; }
    .no-pref-btn.selected { border-color: #8a7a6a; background: #f0ece6; color: #5a4a3a; }
    .comment-wrap { margin-top: 0.8rem; }
    .comment-label { font-size: 0.78rem; color: #aaa; margin-bottom: 0.3rem; }
    .comment-field { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid #e0dbd5; border-radius: 6px; font-size: 0.85rem; font-family: 'Georgia', serif; resize: vertical; min-height: 56px; color: #555; }
    .comment-field:focus { outline: none; border-color: #4a7fa5; }
    .save-btn { display: block; width: 100%; padding: 0.9rem; background: #1a4a6a; color: white; border: none; border-radius: 10px; font-size: 1rem; font-family: 'Georgia', serif; cursor: pointer; margin-top: 1.2rem; transition: opacity 0.2s; }
    .save-btn:hover { opacity: 0.88; }
    .save-msg { text-align: center; color: #4a7fa5; font-size: 0.9rem; margin-top: 0.6rem; min-height: 1.2em; }
    .locked-msg { background: white; border-radius: 12px; padding: 2rem; text-align: center; color: #aaa; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .back-link { display: inline-block; margin-top: 1.5rem; color: #4a7fa5; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
  
    /* Top Navigation Bar */
    .top-nav { background: #2d5016; padding: 0.6rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .top-nav a { color: #d4e6c3; text-decoration: none; font-family: 'Georgia', serif; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.3rem 0.6rem; border-radius: 6px; transition: background 0.2s; }
    .top-nav a:hover { background: rgba(255,255,255,0.15); color: white; }
    .top-nav .nav-brand { color: white; font-size: 0.85rem; font-family: 'Georgia', serif; letter-spacing: 0.05em; opacity: 0.7; flex: 1; }
  </style>
  <script>
    (function() {
      var u = localStorage.getItem('ptUser');
      if (u && u !== 'libby') { window.location.replace('index.html'); }
    })();
  </script>
</head>
<body>
  <nav class="top-nav">
    <span class="nav-brand">Portland Trip 2026 🌲</span>
    <a href="index.html">Homepage</a>
    <a href="tracker.html">Tracker</a>
  </nav>

  <div class="container">
    <h1>🌊 Libby's Survey</h1>
    <p class="subtitle">Your answers help Sarah plan the perfect Portland trip.</p>
    <div class="week-nav" id="week-nav"></div>
    <div id="week-content"></div>
    <a class="back-link" href="index.html">← Back to home</a>
  </div>
  <script src="data.js"></script>
  <script src="questions.js"></script>
  <script>
    const USER = 'libby';
    let currentSection = 0;

    const SECTIONS = [
      { section: 0, label: 'Intro',     weeks: [0] },
      { section: 1, label: 'Section 1', weeks: [1, 2, 3] },
      { section: 2, label: 'Section 2', weeks: [4, 5, 6] },
      { section: 3, label: 'Section 3', weeks: [7, 8, 9] },
      { section: 4, label: 'Section 4', weeks: [10, 11] },
    ];

    function isSectionComplete(sectionNum) {
      const sec = SECTIONS.find(s => s.section === sectionNum);
      if (!sec) return false;
      return sec.weeks.every(w => DATA.isWeekComplete(USER, w));
    }

    function isSectionUnlocked(sectionNum) {
      if (sectionNum === 0) return true;
      return isSectionComplete(sectionNum - 1);
    }

    function init() {
      renderNav();
      let startSection = 0;
      for (let i = 0; i < SECTIONS.length; i++) {
        if (isSectionUnlocked(i)) startSection = i;
        if (isSectionUnlocked(i) && !isSectionComplete(i)) { startSection = i; break; }
      }
      currentSection = startSection;
      renderSection(currentSection);
    }

    function renderNav() {
      const nav = document.getElementById('week-nav');
      nav.innerHTML = SECTIONS.map(s => {
        const unlocked  = isSectionUnlocked(s.section);
        const completed = isSectionComplete(s.section);
        const isActive  = s.section === currentSection;
        let cls = 'week-pill';
        if (!unlocked)  cls += ' locked';
        else if (isActive) cls += ' active';
        else if (completed) cls += ' done';
        else cls += ' unlocked';
        const click = unlocked ? 'onclick="showSection(' + s.section + ')"' : '';
        return '<button class="' + cls + '" ' + click + '>' + s.label + '</button>';
      }).join('');
    }

    function showSection(sectionNum) {
      if (!isSectionUnlocked(sectionNum)) return;
      currentSection = sectionNum;
      renderNav();
      renderSection(sectionNum);
    }

    function renderSection(sectionNum) {
      const sec = SECTIONS.find(s => s.section === sectionNum);
      if (!sec) return;
      const contentEl = document.getElementById('week-content');
      contentEl.innerHTML = '';
      sec.weeks.forEach(weekNum => renderWeekInto(contentEl, weekNum));
    }

    function renderWeekInto(container, weekNum) {
      const wData = QUESTIONS.find(w => w.week === weekNum);
      if (!wData) return;
      const answers = DATA.getAnswers(USER);
      const div = document.createElement('div');
      div.className = 'week-section active';

      let html = '<div class="week-header"><h2>' + (wData.title || 'Week ' + weekNum) + '</h2>';
      if (wData.intro) html += '<p class="intro">' + wData.intro + '</p>';
      html += '</div>';

      wData.questions.forEach(q => {
        const val = answers[q.id] || '';
        let inputHTML = '';
        if (q.type === 'text') {
          inputHTML = '<textarea id="q_' + q.id + '" placeholder="Type here...">' + (val || '') + '</textarea>';
        } else if (q.type === 'scale') {
          const imgH = q.image ? '<div class="place-image-wrap"><a href="' + (q.imageLink || q.image) + '" target="_blank" rel="noopener"><img src="' + q.image + '" alt="' + (q.place || '') + '" loading="lazy"></a></div>' : '';
          inputHTML = imgH + '<div class="scale-btns">' +
            [1,2,3,4,5].map(n => '<button class="scale-btn' + (val == n ? ' selected' : '') + '" data-q="' + q.id + '" data-v="' + n + '" onclick="pickScale(this)">' + n + '</button>').join('') +
            '</div>' +
            '<div class="scale-labels"><span>' + (q.labels ? q.labels[0] : '') + '</span><span>' + (q.labels ? q.labels[1] : '') + '</span></div>' +
            '<button class="no-pref-btn' + (val === 'no_pref' ? ' selected' : '') + '" data-q="' + q.id + '" onclick="pickNoPref(this)">No preference / unsure</button>';
          if (q.note) inputHTML += '<p class="q-note">' + q.note + '</p>';
        }
        html += '<div class="question-card"><p class="question-text">' + q.text + '</p>' + inputHTML + '</div>';
      });

      html += '<button class="save-btn" onclick="saveWeek(' + weekNum + ')">Save Week ' + (weekNum === 0 ? 'Intro' : weekNum) + '</button>';
      div.innerHTML = html;
      container.appendChild(div);
    }

    function pickScale(btn) {
      const qId = btn.dataset.q;
      document.querySelectorAll('.scale-btn[data-q="' + qId + '"]').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('.no-pref-btn[data-q="' + qId + '"]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function pickNoPref(btn) {
      const qId = btn.dataset.q;
      document.querySelectorAll('.scale-btn[data-q="' + qId + '"]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function saveWeek(weekNum) {
      const wData = QUESTIONS.find(w => w.week === weekNum);
      if (!wData) return;
      wData.questions.forEach(q => {
        if (q.type === 'text') {
          const el = document.getElementById('q_' + q.id);
          if (el) DATA.saveAnswer(USER, q.id, el.value);
        } else if (q.type === 'scale') {
          const sel = document.querySelector('.scale-btn.selected[data-q="' + q.id + '"]');
          const noPref = document.querySelector('.no-pref-btn.selected[data-q="' + q.id + '"]');
          if (sel) DATA.saveAnswer(USER, q.id, parseInt(sel.dataset.v));
          else if (noPref) DATA.saveAnswer(USER, q.id, 'no_pref');
        }
      });
      DATA.saveAnswer(USER, 'week_' + weekNum + '_complete', true);
      renderNav();
      renderSection(currentSection);
      document.getElementById('week-nav').scrollIntoView({ behavior: 'smooth' });
    }

    init();
  </script>
</body>
</html>
