<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portland Trip — Jessica's Survey 🏔️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 620px; margin: 0 auto; }
    h1 { font-size: 1.6rem; color: #2d5016; margin-bottom: 0.3rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .week-nav { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .week-pill { padding: 0.35rem 0.8rem; border-radius: 20px; font-size: 0.8rem; border: none; cursor: pointer; font-family: 'Georgia', serif; transition: all 0.2s; }
    .week-pill.locked { background: #e0dbd5; color: #aaa; cursor: not-allowed; }
    .week-pill.unlocked { background: #d4e6c3; color: #3a6b1a; }
    .week-pill.done { background: #6b8e4e; color: white; }
    .week-pill.active { background: #2d5016; color: white; }
    .week-section { display: none; }
    .week-section.active { display: block; }
    .week-header { margin-bottom: 1.2rem; }
    .week-header h2 { font-size: 1.2rem; color: #2d5016; }
    .week-header .intro { font-size: 0.9rem; color: #777; margin-top: 0.3rem; line-height: 1.5; }
    .question-card { background: white; border-radius: 12px; padding: 1.4rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .question-text { font-size: 0.95rem; color: #333; line-height: 1.55; margin-bottom: 1rem; }
    .place-image-wrap { margin-bottom: 1rem; }
    .place-image-wrap a { display: inline-block; border-radius: 8px; overflow: hidden; border: 1px solid #e8e2db; }
    .place-image-wrap img { width: 200px; height: 140px; object-fit: cover; display: block; }
    .scale-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .scale-btn { width: 48px; height: 48px; border-radius: 8px; border: 2px solid #d4e6c3; background: white; font-size: 1rem; font-family: 'Georgia', serif; cursor: pointer; transition: all 0.15s; }
    .scale-btn.selected { background: #6b8e4e; border-color: #6b8e4e; color: white; }
    .scale-labels { display: flex; justify-content: space-between; font-size: 0.72rem; color: #aaa; margin-top: 0.3rem; }
    .yesno-btns { display: flex; gap: 0.6rem; }
    .yn-btn { flex: 1; padding: 0.65rem; border-radius: 8px; border: 2px solid #e0dbd5; background: white; font-size: 0.95rem; font-family: 'Georgia', serif; cursor: pointer; transition: all 0.15s; }
    .yn-btn.yes.selected { background: #6b8e4e; border-color: #6b8e4e; color: white; }
    .yn-btn.no.selected { background: #c0392b; border-color: #c0392b; color: white; }
    .multi-options { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .multi-opt { padding: 0.45rem 0.9rem; border-radius: 20px; border: 2px solid #d4e6c3; background: white; font-size: 0.85rem; font-family: 'Georgia', serif; cursor: pointer; transition: all 0.15s; }
    .multi-opt.selected { background: #6b8e4e; border-color: #6b8e4e; color: white; }
    .text-input { width: 100%; padding: 0.6rem 0.8rem; border: 2px solid #e0dbd5; border-radius: 8px; font-size: 0.9rem; font-family: 'Georgia', serif; resize: vertical; min-height: 72px; }
    .text-input:focus { outline: none; border-color: #6b8e4e; }
    .no-pref-wrap { margin-top: 0.8rem; }
    .no-pref-btn { background: none; border: 1px dashed #c0b8b0; border-radius: 6px; color: #999; font-size: 0.8rem; font-family: 'Georgia', serif; padding: 0.3rem 0.75rem; cursor: pointer; transition: all 0.15s; }
    .no-pref-btn.selected { border-color: #8a7a6a; background: #f0ece6; color: #5a4a3a; }
    .comment-wrap { margin-top: 0.8rem; }
    .comment-label { font-size: 0.78rem; color: #aaa; margin-bottom: 0.3rem; }
    .comment-field { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid #e0dbd5; border-radius: 6px; font-size: 0.85rem; font-family: 'Georgia', serif; resize: vertical; min-height: 56px; color: #555; }
    .comment-field:focus { outline: none; border-color: #6b8e4e; }
    .save-btn { display: block; width: 100%; padding: 0.9rem; background: #2d5016; color: white; border: none; border-radius: 10px; font-size: 1rem; font-family: 'Georgia', serif; cursor: pointer; margin-top: 1.2rem; transition: opacity 0.2s; }
    .save-btn:hover { opacity: 0.88; }
    .save-msg { text-align: center; color: #6b8e4e; font-size: 0.9rem; margin-top: 0.6rem; min-height: 1.2em; }
    .locked-msg { background: white; border-radius: 12px; padding: 2rem; text-align: center; color: #aaa; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .back-link { display: inline-block; margin-top: 1.5rem; color: #6b8e4e; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏔️ Jessica's Survey</h1>
    <p class="subtitle">Your answers help Sarah plan the perfect Portland trip.</p>
    <div class="week-nav" id="week-nav"></div>
    <div id="week-content"></div>
    <a class="back-link" href="index.html">← Back to home</a>
  </div>
  <script src="data.js"></script>
  <script src="questions.js"></script>
  <script>
    const USER = 'jessica';
    let currentWeek = 0;

    function init() {
      renderNav();
      const firstUnlocked = QUESTIONS.find(w => DATA.isWeekUnlocked(w.week));
      if (firstUnlocked) currentWeek = firstUnlocked.week;
      renderWeek(currentWeek);
    }

    function renderNav() {
      const nav = document.getElementById('week-nav');
      nav.innerHTML = QUESTIONS.map(w => {
        const unlocked = DATA.isWeekUnlocked(w.week);
        const completed = DATA.isWeekComplete(USER, w.week);
        const isActive = w.week === currentWeek;
        const classes = ['week-pill',
          !unlocked ? 'locked' : '',
          completed ? 'done' : unlocked ? 'unlocked' : '',
          isActive ? 'active' : ''
        ].filter(Boolean).join(' ');
        const label = w.week === 0 ? 'Intro' : 'Week ' + w.week;
        return '<button class="' + classes + '" onclick="selectWeek(' + w.week + ')"' + (!unlocked ? ' disabled' : '') + '>' + label + '</button>';
      }).join('');
    }

    function selectWeek(week) {
      if (!DATA.isWeekUnlocked(week)) return;
      currentWeek = week;
      renderNav();
      renderWeek(week);
    }

    function renderWeek(week) {
      const wData = QUESTIONS.find(w => w.week === week);
      if (!wData) return;
      const content = document.getElementById('week-content');
      if (!DATA.isWeekUnlocked(week)) {
        const sendDate = new Date(wData.sendDate);
        const formatted = sendDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
        content.innerHTML = '<div class="locked-msg">&#x1F512; Week ' + week + ' opens ' + formatted + '. Check back then!</div>';
        return;
      }
      const answers = DATA.getAnswers(USER);
      const questionsHTML = wData.questions.map(q => {
        const saved = answers[q.id];
        const savedComment = answers[q.id + '_comment'] || '';
        let inputHTML = '';
        if (q.type === 'scale') {
          const btns = [];
          for (let v = q.scale.min; v <= q.scale.max; v++) {
            btns.push('<button class="scale-btn' + (saved == v ? ' selected' : '') + '" onclick="pick(this,\'' + q.id + '\',' + v + ')">' + v + '</button>');
          }
          inputHTML = '<div class="scale-btns">' + btns.join('') + '</div><div class="scale-labels"><span>' + q.scale.labels[0] + '</span><span>' + q.scale.labels[1] + '</span></div>';
        } else if (q.type === 'yesno' || q.type === 'yesno_place') {
          inputHTML = '<div class="yesno-btns"><button class="yn-btn yes' + (saved === 'yes' ? ' selected' : '') + '" onclick="pick(this,\'' + q.id + '\',\'yes\')">✓ Yes</button><button class="yn-btn no' + (saved === 'no' ? ' selected' : '') + '" onclick="pick(this,\'' + q.id + '\',\'no\')">✗ No</button></div>';
        } else if (q.type === 'multiselect') {
          const savedArr = Array.isArray(saved) ? saved : [];
          inputHTML = '<div class="multi-options">' + q.options.map(opt => '<button class="multi-opt' + (savedArr.includes(opt) ? ' selected' : '') + '" onclick="toggleMulti(this,\'' + q.id + '\',\'' + opt.replace(/'/g, "\\'") + '\')">' + opt + '</button>').join('') + '</div>';
        } else if (q.type === 'multiplechoice') {
          const savedArr = Array.isArray(saved) ? saved : (saved ? [saved] : []);
          inputHTML = '<div class="multi-options">' + q.options.map(opt => '<button class="multi-opt' + (savedArr.includes(opt) ? ' selected' : '') + '" onclick="pickOne(this,\'' + q.id + '\',\'' + opt.replace(/'/g, "\\'") + '\')">' + opt + '</button>').join('') + '</div>';
        } else if (q.type === 'text') {
          inputHTML = '<textarea class="text-input" id="text-' + q.id + '" placeholder="Type here…">' + (saved || '') + '</textarea>';
        }
        const imageHTML = (q.type === 'yesno_place' && q.image) ? '<div class="place-image-wrap"><a href="' + (q.imageLink || '#') + '" target="_blank" rel="noopener"><img src="' + q.image + '" alt="' + q.place + '" loading="lazy"></a></div>' : '';
        const noPrefSaved = saved === 'no_pref';
        const noPrefHTML = (q.type !== 'text') ? '<div class="no-pref-wrap"><button class="no-pref-btn' + (noPrefSaved ? ' selected' : '') + '" onclick="pickNoPref(this,\'' + q.id + '\')">No preference / unsure</button></div>' : '';
        const commentHTML = (q.type !== 'text') ? '<div class="comment-wrap"><p class="comment-label">Any notes or context?</p><textarea class="comment-field" id="comment-' + q.id + '" placeholder="Optional…">' + savedComment + '</textarea></div>' : '';
        return '<div class="question-card" id="card-' + q.id + '">' + imageHTML + '<p class="question-text">' + q.text + '</p>' + inputHTML + noPrefHTML + commentHTML + '</div>';
      }).join('');
      content.innerHTML = '<div class="week-header"><h2>' + wData.theme + '</h2><p class="intro">' + wData.intro + '</p></div>' + questionsHTML + '<button class="save-btn" onclick="saveWeek()">Save My Answers</button><p class="save-msg" id="save-msg"></p>';
    }

    function pick(btn, qId, value) {
      const card = btn.closest('.question-card');
      const noPrefBtn = card.querySelector('.no-pref-btn');
      if (noPrefBtn) noPrefBtn.classList.remove('selected');
      card.querySelectorAll('.scale-btn, .yn-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }
    function toggleMulti(btn, qId, value) {
      const card = btn.closest('.question-card');
      const noPrefBtn = card.querySelector('.no-pref-btn');
      if (noPrefBtn) noPrefBtn.classList.remove('selected');
      btn.classList.toggle('selected');
    }
    function pickOne(btn, qId, value) {
      const card = btn.closest('.question-card');
      const noPrefBtn = card.querySelector('.no-pref-btn');
      if (noPrefBtn) noPrefBtn.classList.remove('selected');
      card.querySelectorAll('.multi-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }
    function pickNoPref(btn, qId) {
      const card = btn.closest('.question-card');
      card.querySelectorAll('.scale-btn, .yn-btn, .multi-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.toggle('selected');
    }
    function saveWeek() {
      const wData = QUESTIONS.find(w => w.week === currentWeek);
      if (!wData) return;
      wData.questions.forEach(q => {
        const card = document.getElementById('card-' + q.id);
        if (!card) return;
        const noPrefBtn = card.querySelector('.no-pref-btn');
        if (noPrefBtn && noPrefBtn.classList.contains('selected')) {
          DATA.saveAnswer(USER, q.id, 'no_pref');
        } else if (q.type === 'scale') {
          const sel = card.querySelector('.scale-btn.selected');
          if (sel) DATA.saveAnswer(USER, q.id, sel.textContent.trim());
        } else if (q.type === 'yesno' || q.type === 'yesno_place') {
          const sel = card.querySelector('.yn-btn.selected');
          if (sel) DATA.saveAnswer(USER, q.id, sel.classList.contains('yes') ? 'yes' : 'no');
        } else if (q.type === 'multiselect') {
          const sels = Array.from(card.querySelectorAll('.multi-opt.selected')).map(b => b.textContent.trim());
          if (sels.length) DATA.saveAnswer(USER, q.id, sels);
        } else if (q.type === 'multiplechoice') {
          const sel = card.querySelector('.multi-opt.selected');
          if (sel) DATA.saveAnswer(USER, q.id, sel.textContent.trim());
        } else if (q.type === 'text') {
          const el = document.getElementById('text-' + q.id);
          if (el) DATA.saveAnswer(USER, q.id, el.value);
        }
        if (q.type !== 'text') {
          const commentEl = document.getElementById('comment-' + q.id);
          if (commentEl && commentEl.value.trim()) DATA.saveAnswer(USER, q.id + '_comment', commentEl.value.trim());
        }
      });
      const msg = document.getElementById('save-msg');
      msg.textContent = '✓ Answers saved!';
      setTimeout(() => { msg.textContent = ''; }, 3000);
      renderNav();
    }
    init();
  </script>
</body>
</html>
